name: .NET Tests

on:
  push:
    branches: [ main, lab_2-3 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./Polyclinic/Polyclinic.sln

      - name: Build
        run: dotnet build ./Polyclinic/Polyclinic.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ./Polyclinic/Tests/Tests.csproj --configuration Release --verbosity normal